    <!-- Critical CSS inline (will be added by build process) -->
    <style>
      /* Critical above-the-fold — matches AppLoader editorial tokens */
      :root {
        --bg-canvas: #eaf9d9;
        --text-primary: #191735;
        --brand-accent: #2f2963;
        --brand-accent-soft: #e3e1f0;
        --border-subtle: #d2e6c0;
        --font-display: 'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-body: 'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      body { margin: 0; font-family: var(--font-body); background-color: var(--bg-canvas); color: var(--text-primary); }
      #root { min-height: 100vh; }
      .app-loader-static {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: var(--bg-canvas);
      }
      .app-loader-static__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
        padding: 0 1.5rem;
      }
      .app-loader-static__brand {
        display: flex;
        align-items: center;
        gap: 0.625rem;
      }
      .app-loader-static__mark {
        width: 2.6rem;
        height: 2.6rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .app-loader-static__wordmark {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 1.5rem;
        letter-spacing: -0.02em;
        color: var(--text-primary);
      }
      .app-loader-static__progress-wrap {
        width: 12rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        align-items: center;
      }
      .app-loader-static__blocks {
        display: flex;
        gap: 0.375rem;
        align-items: center;
      }
      .app-loader-static__block {
        display: block;
        width: 1.5rem;
        height: 0.25rem;
        border-radius: 9999px;
        background: var(--brand-accent-soft);
        animation: app-loader-pulse 1.2s ease-in-out infinite;
      }
      .app-loader-static__block:nth-child(2) { animation-delay: 0.15s; }
      .app-loader-static__block:nth-child(3) { animation-delay: 0.3s; }
      .app-loader-static__block:nth-child(4) { animation-delay: 0.45s; }
      .app-loader-static__track {
        width: 100%;
        height: 1px;
        border-radius: 9999px;
        background: var(--border-subtle);
        overflow: hidden;
      }
      .app-loader-static__bar {
        height: 100%;
        width: 45%;
        border-radius: 9999px;
        background: var(--brand-accent);
        animation: app-loader-bar 1.5s ease-in-out infinite;
      }
      @keyframes app-loader-pulse {
        0%, 100% { opacity: 0.4; transform: scaleX(0.3); background: var(--brand-accent-soft); }
        50% { opacity: 1; transform: scaleX(1); background: var(--brand-accent); }
      }
      @keyframes app-loader-bar {
        0% { width: 0%; margin-left: 0; }
        50% { width: 75%; margin-left: 12.5%; }
        100% { width: 100%; margin-left: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-loader-static__block,
        .app-loader-static__bar { animation: none; }
        .app-loader-static__bar { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loader-static" role="status" aria-live="polite" aria-label="Loading TechSteps">
        <div class="app-loader-static__inner">
          <div class="app-loader-static__brand">
            <div class="app-loader-static__mark" aria-hidden="true">
              <svg width="100%" height="100%" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="4" y="21" width="6" height="8" rx="1.8" fill="#429ea6"/>
                <rect x="10" y="15" width="6" height="14" rx="1.8" fill="#429ea6"/>
                <rect x="16" y="9" width="6" height="20" rx="1.8" fill="#2f2963"/>
                <rect x="22" y="3" width="6" height="26" rx="1.8" fill="#2f2963"/>
              </svg>
            </div>
            <span class="app-loader-static__wordmark">TECHSTEPS</span>
          </div>
          <div class="app-loader-static__progress-wrap" aria-hidden="true">
            <div class="app-loader-static__blocks">
              <span class="app-loader-static__block"></span>
              <span class="app-loader-static__block"></span>
              <span class="app-loader-static__block"></span>
              <span class="app-loader-static__block"></span>
            </div>
            <div class="app-loader-static__track">
              <div class="app-loader-static__bar"></div>
            </div>
          </div>
          <span class="sr-only" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Loading</span>
        </div>
      </div>
    </div>
